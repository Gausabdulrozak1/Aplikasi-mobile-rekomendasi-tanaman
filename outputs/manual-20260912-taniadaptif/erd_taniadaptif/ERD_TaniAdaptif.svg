<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <rect width="2400" height="1400" fill="#ffffff"/>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #1e293b; }
    .subtitle { font-family: Arial, sans-serif; font-size: 21px; fill: #64748b; }
    .table { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
    .header { fill: #1e3a5f; }
    .head-text { font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
    .column-head { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #475569; }
    .field { font-family: Arial, sans-serif; font-size: 17px; fill: #1e293b; }
    .type { font-family: Arial, sans-serif; font-size: 16px; fill: #475569; }
    .key { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1e3a5f; }
    .row-line { stroke: #cbd5e1; stroke-width: 1.5; }
    .rel { stroke: #475569; stroke-width: 3; fill: none; }
    .rel-label { font-family: Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #334155; }
    .rel-name { font-family: Arial, sans-serif; font-size: 17px; font-style: italic; fill: #64748b; }
    .footer { font-family: Arial, sans-serif; font-size: 16px; fill: #64748b; }
    .legend { font-family: Arial, sans-serif; font-size: 16px; fill: #475569; }
  </style>

  <text x="80" y="78" class="title">ERD BASIS DATA SISTEM TANIADAPTIF</text>
